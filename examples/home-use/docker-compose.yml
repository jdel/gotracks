# gotracks — home use.
#
# Single container: SQLite database, attachments on local disk, no legal pages,
# mail printed to the log. The simplest thing that works.
#
#   docker compose up -d
#   open http://localhost:8080
#
# Registration is closed — a home instance is for one person. The first account
# still registers on an empty instance and becomes the administrator; after that
# nobody else can sign up. Because no mail server is configured, the
# account-activation link is printed to the log instead of emailed — find it
# with:  docker compose logs gotracks
services:
  gotracks:
    image: ghcr.io/jdel/gotracks:latest
    # Build from this checkout instead of pulling the published image.
    # Run:  docker compose up -d --build
    build:
      context: ../..
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Signing key for sessions. Deliberately unset: gotracks generates a random
      # one at startup, so there is NO secret committed in this file to leak. The
      # only cost is that a restart signs everyone out. For an instance you keep,
      # set your own so sessions survive restarts:
      #   GOTRACKS_AUTH_JWT_SECRET: <output of: openssl rand -hex 32>
      # NEVER copy a signing secret out of an example into a real deployment — a
      # key anyone can read from this repo is a key anyone can forge admin tokens
      # with.
      # GOTRACKS_AUTH_JWT_SECRET:  (unset — auto-generated each boot)
      GOTRACKS_AUTH_ALLOW_REGISTER: "false"
      GOTRACKS_LOG_FORMAT: text
      # No mail server here, so account links are printed to the log. At debug
      # level the full message body (with the link) is logged; find it with:
      #   docker compose logs gotracks | grep -A2 "mail body"
      GOTRACKS_LOG_LEVEL: debug
      # The externally reachable URL. Without it the logged activation link is
      # relative (/accept-invitation?token=…); with it the link is absolute and
      # clickable, and passkeys work (localhost is a secure WebAuthn origin).
      GOTRACKS_HTTP_PUBLIC_URL: ${GOTRACKS_HTTP_PUBLIC_URL:-http://localhost:8080}
      # SQLite + local attachment storage, both under /data (the image default,
      # shown here for clarity).
      GOTRACKS_DB_URL: sqlite:/data/gotracks.db
      GOTRACKS_STORAGE_TYPE: local
      GOTRACKS_STORAGE_UPLOADS: /data/uploads
    volumes:
      - ./data:/data
