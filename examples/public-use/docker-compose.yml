# gotracks — public use, single node.
#
# SQLite, attachments on local disk, legal pages on, and a fake SMTP inbox
# (Mailpit) so account mail actually arrives somewhere you can read.
#
#   docker compose up -d
#   open http://localhost:8080        the app
#   open http://localhost:8025        Mailpit — every email gotracks sends
#
# This is a real single-node deployment shape. It is NOT highly available:
# SQLite and local storage pin it to one node. For that, see ../public-ha.
services:
  gotracks:
    image: ghcr.io/jdel/gotracks:latest
    # Build from this checkout instead of pulling the published image.
    # Run:  docker compose up -d --build
    build:
      context: ../..
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      # Change both for a real deployment: openssl rand -hex 32
      GOTRACKS_AUTH_JWT_SECRET: ${GOTRACKS_AUTH_JWT_SECRET:-public-use-change-me-000000000000000000000000000000000000}
      # Public registration is open. Register the first account (which becomes
      # the administrator) before exposing this to the internet; the admin can
      # close registration from the UI afterwards if wanted.
      GOTRACKS_AUTH_ALLOW_REGISTER: "true"
      GOTRACKS_LOG_FORMAT: json

      # SQLite + local attachment storage under /data.
      GOTRACKS_DB_URL: sqlite:/data/gotracks.db
      GOTRACKS_STORAGE_TYPE: local
      GOTRACKS_STORAGE_UPLOADS: /data/uploads

      # Terms, privacy and cookie pages, plus the one-checkbox consent at
      # registration and the admin editor.
      GOTRACKS_LEGAL_ENABLED: "true"

      # The externally reachable URL: used to build links in mail and to enable
      # passkeys. localhost is a secure origin for WebAuthn, so passkeys work
      # here without TLS; behind a real domain, front this with HTTPS.
      GOTRACKS_HTTP_PUBLIC_URL: ${GOTRACKS_HTTP_PUBLIC_URL:-http://localhost:8080}

      # Send mail to the Mailpit inbox over STARTTLS, verified against the
      # self-signed cert (SAN includes `mailpit`) that gotracks trusts through
      # SSL_CERT_FILE — no skip-verify.
      GOTRACKS_MAIL_PROVIDER: smtp
      GOTRACKS_MAIL_FROM: ${GOTRACKS_MAIL_FROM:-gotracks@example.test}
      GOTRACKS_MAIL_SMTP_HOST: mailpit
      GOTRACKS_MAIL_SMTP_PORT: "1025"
      GOTRACKS_MAIL_SMTP_ENCRYPTION: starttls
      SSL_CERT_FILE: /certs/public.crt
    volumes:
      - ./data:/data
      - ./certs:/certs:ro

  # One-shot: generate a self-signed cert into ./certs (SAN=mailpit) so gotracks
  # can verify the STARTTLS connection to Mailpit. Delete ./certs to regenerate.
  certgen:
    image: alpine/openssl:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/public.crt ]; then
          echo "generating self-signed certificate for Mailpit..."
          openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
            -keyout /certs/private.key -out /certs/public.crt \
            -subj "/CN=gotracks-demo" \
            -addext "subjectAltName=DNS:mailpit,DNS:localhost,IP:127.0.0.1"
          chmod 644 /certs/public.crt
          chmod 600 /certs/private.key
        fi
    volumes:
      - ./certs:/certs

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    depends_on:
      certgen:
        condition: service_completed_successfully
    # STARTTLS on the SMTP port, required (matches gotracks encryption=starttls).
    environment:
      MP_SMTP_TLS_CERT: /certs/public.crt
      MP_SMTP_TLS_KEY: /certs/private.key
      MP_SMTP_REQUIRE_STARTTLS: "true"
    ports:
      - "8025:8025" # web inbox; SMTP is on mailpit:1025 inside the network
    volumes:
      - ./certs:/certs:ro
