# Round-robin load balancer over the two gotracks replicas.
#
# gotracks keeps no per-instance sign-in state — WebAuthn ceremonies and
# two-factor challenges live in the shared database — so no sticky sessions are
# needed; either replica can serve any request.
events {}

http {
    upstream gotracks {
        server gotracks1:8080;
        server gotracks2:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://gotracks;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
