version: 2
updates:
  # Go module dependencies (go.mod / go.sum)
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go-deps:
        patterns:
          - "*"

  # npm dependencies for the React UI
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      ui-deps:
        patterns:
          - "*"
    ignore:
      # typescript-eslint (latest 8.65.0) peers on typescript ">=4.8.4 <6.1.0",
      # so a bump to TypeScript 6.1/7.x breaks the install. Hold typescript at
      # what the linter supports; lift this once typescript-eslint allows newer.
      - dependency-name: "typescript"
        versions: [">=6.1.0"]

  # GitHub Actions in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"