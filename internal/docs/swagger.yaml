basePath: /
definitions:
  api.acceptInvitationRequest:
    properties:
      acceptLegal:
        type: boolean
      newPassword:
        type: string
      token:
        type: string
    type: object
  api.adminUser:
    properties:
      createdAt:
        type: string
      email:
        description: |-
          Email is the account identity: unique, required, and stored lower-cased.
          There is no separate username — one fewer thing to choose, to remember,
          and to have to police for impersonation.
        type: string
      emailVerifiedAt:
        description: |-
          EmailVerifiedAt is nil until the address is proven. Nullable, so it can
          be added to a populated table.
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      twoFactorEnabled:
        type: boolean
      updatedAt:
        type: string
    type: object
  api.adminUserPage:
    properties:
      items:
        items:
          $ref: '#/definitions/api.adminUser'
        type: array
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
    type: object
  api.authResponse:
    properties:
      tokens:
        $ref: '#/definitions/service.TokenPair'
      twoFactor:
        $ref: '#/definitions/service.Challenge'
      user:
        $ref: '#/definitions/domain.User'
    type: object
  api.changePasswordRequest:
    properties:
      currentPassword:
        type: string
      newPassword:
        type: string
      passkeyResponse:
        items:
          type: integer
        type: array
      passkeySessionId:
        description: |-
          PasskeySessionID and PasskeyResponse are the alternative proof. The
          response is left raw: it is the browser's credential object, which does
          not survive a strict decode.
        type: string
    type: object
  api.contextInUseBody:
    properties:
      error:
        type: string
      recurring:
        type: integer
      todos:
        type: integer
    type: object
  api.contextRequest:
    properties:
      name:
        type: string
      position:
        type: integer
      state:
        type: string
    type: object
  api.createUserRequest:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
    type: object
  api.disableRequest:
    properties:
      code:
        type: string
      password:
        type: string
    type: object
  api.emailChangeRequest:
    properties:
      newEmail:
        type: string
    type: object
  api.emailRequest:
    properties:
      email:
        type: string
    type: object
  api.enrolFinishRequest:
    properties:
      code:
        type: string
      enrolmentId:
        type: string
    type: object
  api.errorBody:
    properties:
      error:
        type: string
    type: object
  api.instanceSettingsRequest:
    properties:
      allowRegister:
        type: boolean
      usageReportAtMinute:
        description: UsageReportAtMinute is a pointer so "absent" is distinct from
          midnight.
        type: integer
      usageReportTimeZone:
        type: string
    type: object
  api.legalDocumentRequest:
    properties:
      body:
        description: Body replaces the shipped text. Empty resets to it.
        type: string
    type: object
  api.legalEditorBody:
    properties:
      defaults:
        additionalProperties:
          additionalProperties:
            type: string
          type: object
        description: |-
          Defaults is what the binary ships, so the editor can reset to it without
          hard-coding the text twice.
        type: object
      overrides:
        additionalProperties:
          additionalProperties:
            type: string
          type: object
        type: object
    type: object
  api.logLevelRequest:
    properties:
      durationMinutes:
        type: integer
      level:
        type: string
    type: object
  api.loginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  api.noteRequest:
    properties:
      body:
        type: string
      clearProject:
        description: |-
          ClearProject detaches an existing note from its project. A nil
          ProjectID alone cannot mean that: it is also what "leave unchanged"
          looks like on update.
        type: boolean
      projectId:
        type: integer
      projectName:
        description: |-
          ProjectName lets a client name a project instead of supplying an id —
          an unknown name is created on the fly, the same "#project" behaviour a
          todo or a recurring pattern gets. Ignored if ProjectID is also set.
        type: string
    type: object
  api.passkeyFinishRequest:
    properties:
      name:
        type: string
      response:
        items:
          type: integer
        type: array
      sessionId:
        type: string
    type: object
  api.passkeyLoginBeginRequest:
    properties:
      email:
        type: string
    type: object
  api.passwordRequest:
    properties:
      password:
        type: string
    type: object
  api.preferenceRequest:
    properties:
      autoDeleteAttachments:
        type: boolean
      dateFormat:
        type: string
      locale:
        type: string
      reviewPeriod:
        type: integer
      theme:
        type: string
      timeZone:
        type: string
      weekStart:
        type: integer
    type: object
  api.projectRequest:
    properties:
      defaultContextId:
        type: integer
      description:
        type: string
      name:
        type: string
      position:
        type: integer
      state:
        type: string
    type: object
  api.publicConfig:
    properties:
      allowRegister:
        type: boolean
      legal:
        type: boolean
      passkeys:
        type: boolean
      twoFactor:
        type: boolean
    type: object
  api.recurringRequest:
    properties:
      contextId:
        type: integer
      contextName:
        type: string
      dayOfMonth:
        type: integer
      description:
        type: string
      endDate:
        type: string
      everyN:
        type: integer
      monthOfYear:
        type: integer
      notes:
        type: string
      period:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      showFromDays:
        type: integer
      startFrom:
        type: string
      state:
        type: string
      weekdays:
        type: string
    type: object
  api.refreshRequest:
    properties:
      refreshToken:
        type: string
    type: object
  api.registerRequest:
    properties:
      email:
        type: string
      locale:
        description: |-
          Locale is the language picked on the form. Optional: an absent or
          unsupported value leaves the account on the default.
        type: string
      timeZone:
        description: |-
          TimeZone is the browser's IANA zone, used before the account can sign in
          and save preferences itself.
        type: string
    type: object
  api.reorderRequest:
    properties:
      position:
        type: integer
    type: object
  api.resetPasswordRequest:
    properties:
      newPassword:
        type: string
      token:
        type: string
    type: object
  api.todoRequest:
    properties:
      contextId:
        type: integer
      contextName:
        description: 'Names are an alternative to ids: an unknown name is created
          automatically.'
        type: string
      description:
        type: string
      due:
        type: string
      notes:
        type: string
      projectId:
        type: integer
      projectName:
        type: string
      showFrom:
        type: string
      starred:
        type: boolean
      tags:
        items:
          type: string
        type: array
    type: object
  api.tokenRequest:
    properties:
      token:
        type: string
    type: object
  api.twoFactorVerifyRequest:
    properties:
      challengeId:
        type: string
      code:
        type: string
    type: object
  api.updateUserRequest:
    properties:
      email:
        type: string
      isAdmin:
        type: boolean
      password:
        type: string
    type: object
  api.versionBody:
    properties:
      version:
        type: string
    type: object
  domain.Attachment:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      fileName:
        type: string
      id:
        type: integer
      size:
        type: integer
      todoId:
        type: integer
    type: object
  domain.AttachmentWithTodo:
    properties:
      contentType:
        type: string
      createdAt:
        type: string
      fileName:
        type: string
      id:
        type: integer
      size:
        type: integer
      todoDescription:
        type: string
      todoId:
        type: integer
      todoState:
        type: string
    type: object
  domain.AuditEvent:
    properties:
      action:
        type: string
      actorEmail:
        type: string
      actorId:
        description: |-
          ActorID is who did it, nil when nobody was signed in — a stranger
          registering, or a failed sign-in.
        type: integer
      detail:
        description: |-
          Detail is a short human-readable note: which field changed, why a
          registration was refused. Never a credential.
        type: string
      hash:
        description: |-
          Hash is a SHA-256, hex-encoded, of the exact bytes an export produced.
          Set only on an export event, so a copy of the file can be proven genuine
          without the log keeping a second copy of everyone's history at rest.
        type: string
      id:
        type: integer
      ip:
        type: string
      occurredAt:
        type: string
      outcome:
        type: string
      targetEmail:
        type: string
      targetId:
        description: |-
          TargetID and TargetEmail are who it was done to, when that differs from
          the actor: an administrator deleting somebody else's account.
        type: integer
      userAgent:
        type: string
    type: object
  domain.Context:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      position:
        type: integer
      state:
        type: string
      updatedAt:
        type: string
    type: object
  domain.Credential:
    properties:
      createdAt:
        type: string
      credentialId:
        description: CredentialID is the raw WebAuthn credential id, base64url encoded.
        type: string
      id:
        type: integer
      lastUsedAt:
        type: string
      name:
        type: string
    type: object
  domain.InstanceSettings:
    properties:
      allowRegister:
        type: boolean
      updatedAt:
        type: string
      usageReportAtMinute:
        description: UsageReportAtMinute is the local wall-clock time of day the report
          runs.
        type: integer
      usageReportRunAt:
        type: string
      usageReportTimeZone:
        type: string
    type: object
  domain.Note:
    properties:
      body:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      projectId:
        type: integer
      updatedAt:
        type: string
    type: object
  domain.Preference:
    properties:
      autoDeleteAttachments:
        description: |-
          AutoDeleteAttachments is a pointer because older databases can contain
          NULL in this column. Nil reads as off, same as false.
        type: boolean
      dateFormat:
        type: string
      locale:
        type: string
      reviewPeriod:
        type: integer
      theme:
        description: light | dark | system
        type: string
      timeZone:
        type: string
      updatedAt:
        type: string
      weekStart:
        description: 0 = Sunday
        type: integer
    type: object
  domain.Project:
    properties:
      completedAt:
        type: string
      createdAt:
        type: string
      defaultContextId:
        type: integer
      description:
        type: string
      id:
        type: integer
      lastReviewed:
        type: string
      name:
        type: string
      position:
        type: integer
      state:
        type: string
      updatedAt:
        type: string
    type: object
  domain.RecurringTodo:
    properties:
      completedAt:
        type: string
      contextId:
        type: integer
      createdAt:
        type: string
      dayOfMonth:
        description: monthly/yearly
        type: integer
      description:
        type: string
      endDate:
        type: string
      everyN:
        type: integer
      id:
        type: integer
      lastSpawnedAt:
        type: string
      monthOfYear:
        description: yearly (1-12)
        type: integer
      notes:
        type: string
      period:
        description: Pattern. EveryN applies to the chosen period (every 2 weeks,
          every 3 months…).
        type: string
      projectId:
        type: integer
      showFromDays:
        description: ShowFromDays makes the spawned action appear this many days before
          it is due.
        type: integer
      startFrom:
        type: string
      state:
        type: string
      updatedAt:
        type: string
      weekdays:
        description: 'weekly: "1,3,5" (Sunday=0)'
        type: string
    type: object
  domain.Tag:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  domain.Todo:
    properties:
      completedAt:
        type: string
      contextId:
        type: integer
      createdAt:
        type: string
      description:
        type: string
      due:
        type: string
      id:
        type: integer
      notes:
        type: string
      position:
        type: integer
      projectId:
        type: integer
      recurringTodoId:
        type: integer
      showFrom:
        type: string
      starred:
        type: boolean
      state:
        type: string
      tags:
        description: Tags is populated on read; not a stored column.
        items:
          type: string
        type: array
      updatedAt:
        type: string
    type: object
  domain.User:
    properties:
      createdAt:
        type: string
      email:
        description: |-
          Email is the account identity: unique, required, and stored lower-cased.
          There is no separate username — one fewer thing to choose, to remember,
          and to have to police for impersonation.
        type: string
      emailVerifiedAt:
        description: |-
          EmailVerifiedAt is nil until the address is proven. Nullable, so it can
          be added to a populated table.
        type: string
      id:
        type: integer
      isAdmin:
        type: boolean
      updatedAt:
        type: string
    type: object
  service.AccountUsage:
    properties:
      contextPercent:
        type: integer
      contexts:
        type: integer
      email:
        type: string
      generatedAt:
        type: string
      isAdmin:
        description: |-
          Admin and TwoFactor are carried so the report can be filtered the same
          way the user list is, without joining back to it.
        type: boolean
      notePercent:
        type: integer
      notes:
        type: integer
      projectPercent:
        type: integer
      projects:
        type: integer
      recurring:
        type: integer
      recurringPercent:
        type: integer
      storageBytes:
        type: integer
      storagePercent:
        type: integer
      tagPercent:
        type: integer
      tags:
        type: integer
      todoPercent:
        type: integer
      todos:
        type: integer
      twoFactorEnabled:
        type: boolean
      userId:
        type: integer
      worstPercent:
        description: |-
          WorstPercent is the highest of the above: how close this account is to
          whichever limit it is nearest. Over 100 means it is past one — possible
          because limits are enforced when something is created, not retroactively
          when a limit is lowered.
        type: integer
    type: object
  service.AuditPage:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.AuditEvent'
        type: array
      total:
        type: integer
    type: object
  service.Challenge:
    properties:
      challengeId:
        type: string
      expiresAt:
        type: string
    type: object
  service.ContextCount:
    properties:
      contextId:
        type: integer
      name:
        type: string
      open:
        type: integer
    type: object
  service.Document:
    properties:
      body:
        type: string
      customised:
        description: |-
          Customised reports whether the operator replaced the shipped text, so the
          editor can offer to put it back.
        type: boolean
      kind:
        type: string
    type: object
  service.LogLevelState:
    properties:
      baseline:
        type: string
      level:
        type: string
      overrideUntil:
        type: string
    type: object
  service.MonthCount:
    properties:
      count:
        type: integer
      month:
        description: YYYY-MM
        type: string
    type: object
  service.Quotas:
    properties:
      contexts:
        type: integer
      notes:
        type: integer
      projects:
        type: integer
      recurring:
        type: integer
      storageBytes:
        format: int64
        type: integer
      tags:
        type: integer
      tagsPerTodo:
        description: |-
          TagsPerTodo bounds one request rather than the account total. Tags are
          created implicitly from an action's tag list, so without this a single
          action can mint thousands of rows while costing one against the action
          allowance — the amplifier the other limits do not catch.
        type: integer
      todos:
        type: integer
    type: object
  service.Report:
    properties:
      accounts:
        items:
          $ref: '#/definitions/service.AccountUsage'
        type: array
      generatedAt:
        type: string
      limits:
        $ref: '#/definitions/service.Quotas'
      page:
        type: integer
      pageSize:
        type: integer
      total:
        type: integer
      usageReportAtMinute:
        type: integer
    type: object
  service.Session:
    properties:
      current:
        description: Current marks the session the request was made from.
        type: boolean
      id:
        type: string
      ip:
        type: string
      lastUsed:
        type: string
      startedAt:
        type: string
      userAgent:
        type: string
    type: object
  service.Stats:
    properties:
      active:
        type: integer
      avgCompletionDays:
        type: number
      completed:
        type: integer
      completedLast30:
        type: integer
      completedLast365:
        type: integer
      completionRate:
        type: number
      deferred:
        type: integer
      oldestOpenDays:
        type: integer
      perContext:
        items:
          $ref: '#/definitions/service.ContextCount'
        type: array
      perMonth:
        items:
          $ref: '#/definitions/service.MonthCount'
        type: array
      projectsActive:
        type: integer
      projectsCompleted:
        type: integer
      projectsHidden:
        type: integer
      totalActions:
        type: integer
    type: object
  service.TokenPair:
    properties:
      accessToken:
        type: string
      expiresAt:
        type: string
      refreshToken:
        type: string
    type: object
  service.Usage:
    properties:
      contextLimit:
        type: integer
      contexts:
        type: integer
      noteLimit:
        type: integer
      notes:
        type: integer
      projectLimit:
        type: integer
      projects:
        type: integer
      recurring:
        type: integer
      recurringLimit:
        type: integer
      storageBytes:
        type: integer
      storageLimit:
        type: integer
      tagLimit:
        type: integer
      tags:
        type: integer
      todoLimit:
        type: integer
      todos:
        type: integer
    type: object
info:
  contact: {}
  description: 'A GTD web application: actions, contexts, projects and the tickler.'
  title: gotracks API
  version: "1.0"
paths:
  /api/v1/2fa:
    get:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
      security:
      - BearerAuth: []
      summary: Two-factor status
      tags:
      - twofactor
  /api/v1/2fa/disable:
    post:
      parameters:
      - description: Current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.disableRequest'
      responses:
        "204":
          description: disabled
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Disable two-factor
      tags:
      - twofactor
  /api/v1/2fa/enrol/begin:
    post:
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Begin two-factor enrolment
      tags:
      - twofactor
  /api/v1/2fa/enrol/finish:
    post:
      parameters:
      - description: Confirmation code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.enrolFinishRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Finish two-factor enrolment
      tags:
      - twofactor
  /api/v1/2fa/recovery/regenerate:
    post:
      parameters:
      - description: Current password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.passwordRequest'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Regenerate recovery codes
      tags:
      - twofactor
  /api/v1/admin/audit:
    get:
      parameters:
      - description: Earliest occurrence, RFC 3339
        in: query
        name: from
        type: string
      - description: Latest occurrence, RFC 3339
        in: query
        name: to
        type: string
      - description: Match an address as actor or target
        in: query
        name: actor
        type: string
      - description: Exact action
        in: query
        name: action
        type: string
      - description: success or failure
        in: query
        name: outcome
        type: string
      - description: 1-based page
        in: query
        name: page
        type: integer
      - description: Rows per page
        in: query
        name: pageSize
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.AuditPage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Search the audit log
      tags:
      - admin
  /api/v1/admin/audit/actions:
    get:
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      security:
      - BearerAuth: []
      summary: Audit action vocabulary
      tags:
      - admin
  /api/v1/admin/audit/export:
    get:
      parameters:
      - description: json or csv
        in: query
        name: format
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Export the filtered audit log
      tags:
      - admin
  /api/v1/admin/legal:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.legalEditorBody'
      security:
      - BearerAuth: []
      summary: Legal editor state
      tags:
      - admin
  /api/v1/admin/legal/{locale}/{kind}:
    delete:
      parameters:
      - description: Interface locale
        in: path
        name: locale
        required: true
        type: string
      - description: terms, privacy or cookies
        in: path
        name: kind
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Restore a legal document to the shipped text
      tags:
      - admin
    put:
      parameters:
      - description: Interface locale
        in: path
        name: locale
        required: true
        type: string
      - description: terms, privacy or cookies
        in: path
        name: kind
        required: true
        type: string
      - description: Document; empty resets to the shipped text
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.legalDocumentRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.errorBody'
      security:
      - BearerAuth: []
      summary: Replace a legal document
      tags:
      - admin
  /api/v1/admin/log-level:
    get:
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.LogLevelState'
      security:
      - BearerAuth: []
      summary: Get the runtime log level
      tags:
      - admin
    put:
      parameters:
      - description: Level and duration
        in: body
        name: body
        required: true
        schema:
